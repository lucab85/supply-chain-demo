name: Build, SBOM, and Sign

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Inspect SBOM summary
        run: |
          jq '{
            document: .name,
            package_count: (.packages | length),
            sample_packages: (
              .packages[0:5]
              | map({
                  name: .name,
                  version: .versionInfo
                })
            )
          }' sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image with GitHub OIDC
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}"

      - name: Attest SBOM
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE_REF}"

      - name: Verify image and SBOM attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@refs/heads/main
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity="${CERT_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

          cosign verify-attestation "${IMAGE_REF}" \
            --type spdxjson \
            --certificate-identity="${CERT_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" > /dev/null
